name: Parity Gate

on:
  pull_request:
    paths:
      - 'redteam_rust_core/src/**'
      - 'redteam_rust_core/tests/fixtures/**'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
        
      - name: Start Test Containers
        run: docker compose -f redteam_rust_core/docker-compose.test.yml up -d
        
      - name: Run Baseline Capture (Head)
        run: |
          cd redteam_rust_core
          cargo run --bin capture_baseline
          mv tests/fixtures/golden_baseline.json target/current_scan.json
          
      - name: Checkout Base Baseline
        run: |
          git checkout ${{ github.base_ref }} -- redteam_rust_core/tests/fixtures/golden_baseline.json
          
      - name: Verify Parity
        run: |
          cd redteam_rust_core
          cargo run --bin verify_parity

name: Parity Gate

on:
  pull_request:
    paths:
      - 'redteam_rust_core/src/**'
      - 'redteam_rust_core/tests/baselines/**'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Start Test Containers
        run: docker compose -f redteam_rust_core/docker-compose.test.yml up -d
        
      - name: Generate Base Baseline (Main)
        run: |
          git checkout main
          cd redteam_rust_core
          cargo run --bin capture_baseline
          mkdir -p /tmp/fixtures
          cp tests/baselines/golden_baseline.json /tmp/fixtures/golden_baseline_base.json
          
      - name: Generate PR Baseline
        run: |
          git checkout ${{ github.head_ref }}
          cd redteam_rust_core
          cargo run --bin capture_baseline
          cp tests/baselines/golden_baseline.json target/current_scan.json
          # Use the base baseline generated from main for parity check
          cp /tmp/fixtures/golden_baseline_base.json tests/baselines/golden_baseline.json
          
      - name: Verify Parity
        run: |
          cd redteam_rust_core
          cargo run --bin verify_parity

[package]
name = "redteam_rust_core"
version = "0.1.0"
edition = "2021"
authors = ["Senior Architect <architect@redteam.lab>"]
description = "High-performance, async-first Red Team assessment engine"

[dependencies]
# Async Runtime
tokio = { version = "1.28", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.4"
regex = "1.9"
rand = "0.8"
rand_distr = "0.4"
quick-xml = { version = "0.31", features = ["serialize"] }
dashmap = "5.5"
which = "4.4"
hickory-resolver = "0.24"

# Network
reqwest = { version = "0.11", features = ["json", "rustls-tls", "gzip", "stream"] }

# CLI & Interface
clap = { version = "4.3", features = ["derive"] }
indicatif = "0.17" # Progress bars

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"

# Files & Templating
tempfile = "3.8"
handlebars = "4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true # Strip symbols for smaller binary

[package]
name = "redteam_rust_core"
version = "0.1.0"
edition = "2021"
authors = ["Senior Architect <architect@redteam.lab>"]
description = "High-performance, async-first Red Team assessment engine"

[dependencies]
# Async Runtime
tokio = { version = "1.28", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
url = "2.4"
regex = "1.9"
rand = "0.8"
rand_distr = "0.4"
quick-xml = { version = "0.31", features = ["serialize"] }
dashmap = "5.5"
moka = { version = "0.10", features = ["future"] }
crossbeam = "0.8"
bloomfilter = "1.0"
which = "4.4"
hickory-resolver = { version = "0.24", features = ["tokio-rustls", "system-config", "dns-over-https-rustls", "webpki-roots"] }
html-escape = "0.2"
urlencoding = "2.1"

# Network
reqwest = { version = "0.11", features = ["json", "rustls-tls", "gzip", "stream"] }

# CLI & Interface
clap = { version = "4.3", features = ["derive"] }
indicatif = "0.17" # Progress bars
inquire = "0.6"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] } # Added json feature
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = "0.14"
anyhow = "1.0"
thiserror = "1.0"

# Files & Templating
tempfile = "3.8"
handlebars = "4.3"
tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
once_cell = "1.21.3"
rustix = { version = "1.1.3", features = ["process"] }
libc = "0.2.182"
async-stream = "0.3.6"
dotenv = "0.15.0"
libloading = "0.9.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "macros", "json"] }
sysinfo = "0.30.5"
flate2 = "1.0.28"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
rust-embed = "8.4"
tokio-stream = "0.1"
mime_guess = "2.0"



# Networking & High Performance
io-uring = "0.7"
smoltcp = { version = "0.11", features = ["socket-tcp", "socket-raw", "socket-udp"] }
siphasher = "0.3"
aya = "0.13"
socket2 = "0.5"

# Persistence & Swarm
# RocksDB and Chitchat removed as they were not used in the final v4.0 architecture and caused build failures.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true # Strip symbols for smaller binary

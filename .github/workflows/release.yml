# =============================================================================
# release.yml — GitHub Actions: Build Docker Image + Push a GHCR
# OsintUltimate / redteam_rust_core
# =============================================================================
# Triggers:
#   - Push de tag semver (v*.*.*)
#   - Push a main (imagen latest)
#   - Invocación manual (workflow_dispatch)
# =============================================================================

name: Release — Docker Build & Push (GHCR)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_image:
        description: "Pushear imagen al registro?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/osintultimate
  CRATE_DIR: redteam_rust_core

jobs:
  docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # Necesario para push a GHCR
      id-token: write      # Para firmado con cosign (SLSA)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar QEMU (para builds multi-arch amd64/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos Docker (tags y labels OCI)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag semver desde el tag de git (v3.0.0 → 3.0.0, 3.0, 3, latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # SHA corto para builds de main (no tags)
            type=sha,prefix=sha-,format=short
            # latest para rama main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=OsintUltimate
            org.opencontainers.image.description=High-performance async Red Team assessment engine
            org.opencontainers.image.vendor=RedTeam Lab
            org.opencontainers.image.licenses=MIT

      - name: Build y Push imagen Docker multi-arch
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CRATE_DIR }}
          dockerfile: ${{ env.CRATE_DIR }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de capas en GHCR para builds rápidos
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Provenance SBOM (Software Bill of Materials)
          provenance: true
          sbom: true

      - name: Inspeccionar digest de la imagen
        run: |
          echo "📦 Imagen publicada:"
          echo "   Digest: ${{ steps.build-push.outputs.digest }}"
          echo "   Tags:   ${{ steps.meta.outputs.tags }}"

      # ── Firmado de imagen con cosign (Supply Chain Security) ─────────────────
      - name: Instalar cosign
        uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Firmar imagen con cosign (keyless via OIDC)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

  # ── Job separado: Crear GitHub Release con el binario ────────────────────────
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev libssl-dev pkg-config

      - name: Compilar binario release
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          cargo build --release --locked
          # Comprimir binario para el release
          tar -czvf osintultimate-linux-x64.tar.gz \
            -C target/release redteam_rust_core

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CRATE_DIR }}/osintultimate-linux-x64.tar.gz
          generate_release_notes: true
          body: |
            ## 🚀 OsintUltimate ${{ github.ref_name }}

            ### Imagen Docker
            ```bash
            # Pull de la imagen
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

            # Escaneo básico
            docker run --rm ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
              --target example.com

            # Scan activo con privilegios (nmap -sS)
            docker run --rm --cap-add=NET_RAW --cap-add=NET_ADMIN \
              --user root \
              ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
              --target example.com --vuln-scan
            ```

            ### Binario Linux (x64)
            Descargar `osintultimate-linux-x64.tar.gz` y ejecutar:
            ```bash
            tar -xzvf osintultimate-linux-x64.tar.gz
            sudo ./redteam_rust_core --target example.com
            ```
